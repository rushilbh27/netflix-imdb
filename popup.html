<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoFluff</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="pop">

  <header class="pop-top">
    <img src="icons/icon48.png" width="34" height="34" alt="">
    <strong>NoFluff</strong>
  </header>

  <section id="needsKey" class="block" hidden>
    <h1>One step left.</h1>
    <p>Ratings need a free OMDb key. Setup takes about a minute, and the page walks you through it.</p>
    <button id="setup" class="btn btn-ink wide" type="button">Set up my key</button>
  </section>

  <section id="isOn" class="block" hidden>
    <div><span class="pill" data-tone="ok">Ratings are on</span></div>
    <div class="quota">
      <div class="quota-text"><strong id="left">–</strong><span id="note">lookups left today</span></div>
      <div class="meter" id="meter" data-level="ok"><span id="fill"></span></div>
    </div>
    <div class="pair">
      <a class="btn btn-yellow" href="https://www.netflix.com/" target="_blank" rel="noreferrer">Open Netflix</a>
      <button id="settings" class="btn" type="button">Settings</button>
    </div>
  </section>

  <section class="skip" aria-label="Skipping">
    <div class="skip-head">
      <h2>Skipping</h2>
      <span class="skip-count"><strong id="skToday">0</strong> skipped today</span>
    </div>
    <label class="row"><span>YouTube ads</span><input type="checkbox" data-group="sites" data-key="youtube"><i></i></label>
    <label class="row"><span>Netflix intros</span><input type="checkbox" data-group="sites" data-key="netflix"><i></i></label>
    <label class="row"><span>Prime Video intros</span><input type="checkbox" data-group="sites" data-key="prime"><i></i></label>
    <details class="skip-more">
      <summary>What to skip</summary>
      <label class="row"><span>YouTube ads</span><input type="checkbox" data-group="types" data-key="ytAd"><i></i></label>
      <label class="row"><span>Ad banners</span><input type="checkbox" data-group="types" data-key="ytOverlay"><i></i></label>
      <label class="row"><span>Intros</span><input type="checkbox" data-group="types" data-key="intro"><i></i></label>
      <label class="row"><span>Recaps</span><input type="checkbox" data-group="types" data-key="recap"><i></i></label>
      <label class="row"><span>Credits</span><input type="checkbox" data-group="types" data-key="credits"><i></i></label>
    </details>
  </section>

  <footer class="pop-foot">
    <a href="https://github.com/rushilbh27/nofluff" target="_blank" rel="noreferrer">GitHub</a>
    <span id="ver"></span>
  </footer>

</main>
<script src="popup.js"></script>
<script src="skipit-popup.js"></script>
</body>
</html>
