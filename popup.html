<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netflix IMDb Ratings</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="pop">

  <header class="pop-top">
    <img src="icons/icon48.png" width="34" height="34" alt="">
    <strong>Netflix IMDb Ratings</strong>
  </header>

  <section id="needsKey" class="block" hidden>
    <h1>One step left.</h1>
    <p>Ratings need a free OMDb key. Setup takes about a minute, and the page walks you through it.</p>
    <button id="setup" class="btn btn-ink wide" type="button">Set up my key</button>
  </section>

  <section id="isOn" class="block" hidden>
    <div><span class="pill" data-tone="ok">Ratings are on</span></div>
    <div class="quota">
      <div class="quota-text"><strong id="left">–</strong><span id="note">lookups left today</span></div>
      <div class="meter" id="meter" data-level="ok"><span id="fill"></span></div>
    </div>
    <div class="pair">
      <a class="btn btn-yellow" href="https://www.netflix.com/" target="_blank" rel="noreferrer">Open Netflix</a>
      <button id="settings" class="btn" type="button">Settings</button>
    </div>
  </section>

  <footer class="pop-foot">
    <a href="https://github.com/rushilbh27/netflix-imdb" target="_blank" rel="noreferrer">GitHub</a>
    <span id="ver"></span>
  </footer>

</main>
<script src="popup.js"></script>
</body>
</html>
